[workspace]
resolver = "3"
members = [
    "crates/horismos-core",
    "crates/horismos-bridges",
    "crates/horismos-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV policy: latest stable minus 2 (docs/framework/12-rust-api.md)
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/billaram/horismos"

[workspace.dependencies]
horismos-core = { path = "crates/horismos-core", version = "0.1.0", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
