[workspace]
resolver = "3"
members = [
    "crates/horismos-core",
    "crates/horismos-host",
    "crates/horismos-fhir",
    "crates/horismos-harness",
    "crates/horismos-bridges",
    "crates/horismos-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV policy: latest stable minus 2 (docs/framework/12-rust-api.md)
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/horismos-hq/horismos"

[workspace.dependencies]
horismos-core = { path = "crates/horismos-core", version = "0.1.0", default-features = false }
horismos-bridges = { path = "crates/horismos-bridges", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
async-trait = "0.1"
proptest = "1"
# Matching benchmarks (PRP-002 U8, decision D-1: naive vs Rete-lite is
# data-driven — doc 14 "Benchmarks (criterion) are CI-tracked from PRP-002
# onward"). Dev-dependency only; never in the library dependency tree.
criterion = "0.7"
# no "clock" feature: horis:now is transaction-stamped, never wall-clock
# (CLAUDE.md determinism rule) — keeping "clock" out of the dependency
# closure makes that a compile-time guarantee, not just a convention.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# Turtle parse/serialize (decision D1, PRP-001 U2): oxigraph's parser crates,
# not the oxigraph store — horismos-core keeps its own interned triple store.
oxttl = { version = "0.2", default-features = false }
oxrdf = { version = "0.3", default-features = false }
# Persistent (HAMT/RRB) collections for the World's instance store (decision
# D4, PRP-001 U6/U8): O(1) snapshots by structural sharing. `imbl` is the
# maintained fork of `im`. Pure, no I/O — safe for the wasm/no-model gate.
imbl = "7"
# horis:pattern evaluation at the validation gate (PRP-001 U6). Pure and
# wasm-safe; no unicode-table features are dropped, since patterns come from
# authored ontologies and may match any XSD string.
regex = "1"
# Snapshot binary form (decision D4, PRP-001 U8): compact, deterministic,
# no_std+alloc — safe for the wasm/no-model gate. Only the `alloc` feature is
# enabled (Vec<u8> output via `to_allocvec`); the default `heapless-cas`
# feature is unneeded since horismos never targets a heapless target.
postcard = { version = "1", default-features = false, features = ["alloc"] }
# BDD verification (PRP-005): owned pure-Rust diagrams and deterministic
# Boolean operations. Verification selects `first_valuation`; the crate's
# random-sampling API is deliberately never used.
biodivine-lib-bdd = { version = "0.6.3", default-features = false }
# biodivine-lib-bdd's unconditional rand 0.8 dependency reaches getrandom
# 0.2 even though Horismos never samples randomly. Enable that version's
# wasm JS backend only on wasm32 so the pure verifier still compiles there.
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
# Existing oxrdf/imbl edges use getrandom 0.3. Its wasm backend additionally
# requires an explicit cfg (in `.cargo/config.toml`) as well as this feature.
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# Bridge clients only (`horismos-bridges` features `bridges-openrouter`
# — PRP-004 U13 — and `bridges-jev`, which reuses this `reqwest` and needs
# no `litellm-rust`; horismos-core must never see these — anti-wrapper
# boundary, CLAUDE.md). `litellm-rust` exact-pinned per captain directive:
# its OpenAI-compatible chat-completions layer is our own audit-metadata
# supplement over (model/finish_reason/OpenRouter routing fields the
# crate's high-level `LiteLLM::completion()` drops — verified empirically
# against 0.3.0's source, see `openrouter.rs` doc comment), so an upstream
# minor bump silently changing that shape is exactly the risk pinning
# removes.
litellm-rust = "=0.3.0"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
