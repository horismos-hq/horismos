[workspace]
resolver = "3"
members = [
    "crates/horismos-core",
    "crates/horismos-bridges",
    "crates/horismos-py",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV policy: latest stable minus 2 (docs/framework/12-rust-api.md)
rust-version = "1.93"
license = "MIT OR Apache-2.0"
repository = "https://github.com/billaram/horismos"

[workspace.dependencies]
horismos-core = { path = "crates/horismos-core", version = "0.1.0", default-features = false }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
proptest = "1"
# no "clock" feature: horis:now is transaction-stamped, never wall-clock
# (CLAUDE.md determinism rule) — keeping "clock" out of the dependency
# closure makes that a compile-time guarantee, not just a convention.
chrono = { version = "0.4", default-features = false, features = ["std"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
# Turtle parse/serialize (decision D1, PRP-001 U2): oxigraph's parser crates,
# not the oxigraph store — horismos-core keeps its own interned triple store.
oxttl = { version = "0.2", default-features = false }
oxrdf = { version = "0.3", default-features = false }
# Persistent (HAMT/RRB) collections for the World's instance store (decision
# D4, PRP-001 U6/U8): O(1) snapshots by structural sharing. `imbl` is the
# maintained fork of `im`. Pure, no I/O — safe for the wasm/no-model gate.
imbl = "7"
# horis:pattern evaluation at the validation gate (PRP-001 U6). Pure and
# wasm-safe; no unicode-table features are dropped, since patterns come from
# authored ontologies and may match any XSD string.
regex = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
