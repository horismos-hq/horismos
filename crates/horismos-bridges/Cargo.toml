[package]
name = "horismos-bridges"
description = "Bridge implementations for the Horismos framework: provider clients (feature-gated) and the mock backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
bridges-anthropic = []
bridges-openai = []
bridges-onnx = []
bridges-openrouter = ["dep:litellm-rust", "dep:reqwest"]
# TypeSafe's Jev (text->decisions) over OpenRouter's Decisions endpoint or
# TypeSafe's own. Default-OFF, like every TLS-carrying bridge, so a plain
# `cargo build` of this crate or of `horismos-py` reaches no provider and no
# TLS stack. The published wheel opts in to both HTTP bridges through
# `[tool.maturin] features` in pyproject.toml; with them in, its aarch64 build
# needs the manylinux_2_28 image (`ring` needs a C compiler that defines
# `__ARM_ARCH`), see .github/workflows/release.yml. Reuses the workspace
# `reqwest` (no second HTTP client); it needs no `litellm-rust`, since the
# Decisions protocol is not OpenAI-compatible.
bridges-jev = ["dep:reqwest"]

[dependencies]
horismos-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
litellm-rust = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# Test-only: drives the HTTP bridges' async reqwest calls against a local
# mock listener (the bridges-openrouter and bridges-jev tests), and gives the
# example binaries their runtime. Never a production dependency — the Bridge
# trait's async methods run inside whatever runtime the caller (e.g. the demo
# binary, PRP-004 U14) already owns.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# Demo-only (PRP-004 U14, examples/triage_agent_demo.rs): a fixed
# horis:now instant for the transaction stamp — never a production
# dependency, and still built with no "clock" feature (CLAUDE.md).
chrono.workspace = true

[lints]
workspace = true
