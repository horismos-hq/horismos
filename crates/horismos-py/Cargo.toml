[package]
name = "horismos-py"
description = "PyO3 bindings for the Horismos framework — no logic, marshaling only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_horismos"
crate-type = ["cdylib"]

[dependencies]
horismos-core = { workspace = true, features = ["verify", "sparql", "mock"] }
horismos-bridges = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py311", "rust_decimal", "chrono"] }
chrono.workspace = true
rust_decimal.workspace = true

[lints]
workspace = true
