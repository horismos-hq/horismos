[package]
name = "horismos-core"
description = "Ontology-first neuro-symbolic agent engine: ontology, world, reasoner, workflows, traces, verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["verify", "sparql"]
# BDD verification (will pull biodivine-lib-bdd when PRP-002/005 activate)
verify = ["dep:biodivine-lib-bdd", "dep:getrandom02"]
# The SPARQL query subset (docs/framework/03-world.md)
sparql = []
# MockBridge + testing utilities (docs/framework/08-bridge.md)
mock = []
# wasm-bindgen surface; mutually exclusive with PyO3 (docs/framework/12-rust-api.md)
wasm = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
# horismos.trace/1 JSON export (PRP-002 U7, docs/framework/09-traces.md).
# Pure, no I/O, wasm-safe — boundary-clean for the no-model gate.
serde_json.workspace = true
async-trait.workspace = true
chrono.workspace = true
rust_decimal.workspace = true
oxttl.workspace = true
oxrdf.workspace = true
imbl.workspace = true
regex.workspace = true
postcard.workspace = true
biodivine-lib-bdd = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { workspace = true, optional = true }
getrandom03.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "matching"
harness = false

[lints]
workspace = true
