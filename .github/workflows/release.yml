# PRP-006: the release pipeline. Supersedes the build-only `wheels.yml`
# (PRP-003 U10), whose matrix and wheel smoke test are folded in below so the
# matrix lives in exactly one place.
#
# Two triggers:
#   * pushing a `v*` tag  -> build, test, publish to PyPI
#   * manual dispatch     -> build, test, publish to TestPyPI (default) or PyPI
#
# Publication uses PyPI Trusted Publishing (OIDC). There is no API token in
# this workflow or in repository secrets, by design: `id-token: write` is
# scoped to the publish job alone, and the `pypi` / `testpypi` environments
# are where the captain registers the publishers and any required reviewers.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      index:
        description: "Which index to publish to"
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
          # universal2 covers both Apple Silicon and Intel macOS in one wheel.
          - os: macos-latest
            target: universal2-apple-darwin
            artifact: macos-universal2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One abi3 wheel per platform serves every CPython >= 3.11.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # The release gate, lifted from `wheels.yml`: install the built wheel with
  # no index available and run the doc-11 symbolic quickstart verbatim on
  # every supported CPython. Publication depends on this passing.
  #
  # The linux-aarch64 wheel is built but not smoke-tested: there is no
  # aarch64 Linux runner available to this repository to execute it on. It
  # is the one published artefact whose first real exercise is a user's
  # install, so check it by hand after the TestPyPI rehearsal.
  test:
    name: test (${{ matrix.artifact }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # `os` already exists in the matrix, so these only attach `artifact`
        # to every combination with that `os` — they add no new jobs.
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-universal2
          - os: windows-latest
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist
      - name: Install the wheel and run the symbolic quickstart verbatim
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist horismos
          python - <<'EOF'
          # Extract and exec the doc-11 symbolic quickstart, verbatim.
          import re, pathlib
          text = pathlib.Path("docs/framework/11-python-api.md").read_text()
          section = re.split(r"^#+ .*Quickstart \(symbolic.*$", text, flags=re.M)[1]
          section = re.split(r"^#+ ", section, maxsplit=1, flags=re.M)[0]
          blocks = re.findall(r"```python\n(.*?)```", section, flags=re.S)
          assert blocks
          ns = {}
          for block in blocks:
              exec(compile(block, "<quickstart>", "exec"), ns)
          EOF

  publish:
    name: publish (${{ inputs.index || 'pypi' }})
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    # Registered against these exact names on PyPI / TestPyPI. A mismatch
    # fails at upload time with what looks like an auth error.
    environment: ${{ inputs.index || 'pypi' }}
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC) — scoped to this job only.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
