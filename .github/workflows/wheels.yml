# PRP-003 U10: the wheel-build matrix CONFIGURATION (B5 ownership split).
# PRP-006 owns matrix execution, publication, and CI gating — this file is
# checked in with a manual trigger only, and PRP-006 wires push/PR triggers
# and required-check gating when it takes over (dated deferral note in
# PRPs/PRP-003-python-bindings/02-tasks-and-gaps.md).
name: wheels

on:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # One abi3 wheel per platform serves every CPython >= 3.11.
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - name: Install the wheel and run the symbolic quickstart verbatim
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist horismos
          python - <<'EOF'
          # Extract and exec the doc-11 symbolic quickstart, verbatim.
          import re, pathlib
          text = pathlib.Path("docs/framework/11-python-api.md").read_text()
          section = re.split(r"^#+ .*Quickstart \(symbolic.*$", text, flags=re.M)[1]
          section = re.split(r"^#+ ", section, maxsplit=1, flags=re.M)[0]
          blocks = re.findall(r"```python\n(.*?)```", section, flags=re.S)
          assert blocks
          ns = {}
          for block in blocks:
              exec(compile(block, "<quickstart>", "exec"), ns)
          EOF
