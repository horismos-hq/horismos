[build-system]
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "horismos"
description = "Ontology-first neuro-symbolic agent framework: Rust core, Python bindings. Neural proposes; symbolic decides."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
# Declared explicitly (PEP 639): maturin's sdist packer does not otherwise
# reach files at the repository root, and PyPI rejects an sdist whose
# `License-File:` metadata names a file the tarball does not contain. The
# `maturin>=1.9.3` floor above is a requirement of this key, not incidental: do
# not lower it without rebuilding the sdist and checking every file listed below is
# inside it. THIRD_PARTY_NOTICES.txt carries the notices of the third-party crates
# compiled into the native module; it is generated (`make notices`), and
# python/tests/test_third_party_notices.py fails if it is stale or missing from
# a built artefact.
license-files = ["LICENSE-APACHE", "LICENSE-MIT", "THIRD_PARTY_NOTICES.txt"]
authors = [{ name = "Ramkumar M" }]
# Version is dynamic on purpose: maturin reads the workspace `version` in the
# root Cargo.toml, so the Rust and Python versions can never drift apart.
# Cargo takes SemVer (`X.Y.Z-alpha.N`); maturin normalises it to the PEP 440
# `X.Y.ZaN`. A stable `X.Y.Z` passes through unchanged.
dynamic = ["version"]
keywords = ["ontology", "neuro-symbolic", "agents", "rdf", "reasoning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.horismos.ai/"
Documentation = "https://docs.horismos.ai/"
Source = "https://github.com/horismos-hq/horismos"
Issues = "https://github.com/horismos-hq/horismos/issues"

# The MuJoCo shield demo (examples/mujoco, PRP-009 tier 3) is an extra, never a
# core dependency: the wheel's metadata names mujoco only under
# `extra == "mujoco"`, `pip install horismos` installs none of it, and nothing the
# package imports or tests needs it. Pinned exactly because the demo's pinned
# verdict sequence repeats only on one physics build (pinned on mujoco 3.14.0,
# macOS 26 arm64, Python 3.13); `make demo-shield` installs it into .venv.
[project.optional-dependencies]
mujoco = ["mujoco==3.14.0"]

[dependency-groups]
dev = [
    "maturin>=1.9.3,<2",
    "pytest>=8",
    "mypy>=1.14",
    "ruff>=0.8",
    "hypothesis>=6",
]

# uv caches the editable build of this package and, by default, rebuilds it only
# when pyproject.toml changes. The version and the native module both come from
# the Rust workspace, so a Cargo version bump or a Rust edit must invalidate that
# cache too, or `uv run` keeps serving the old extension and its old version.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/*.rs" },
]

[tool.maturin]
manifest-path = "crates/horismos-py/Cargo.toml"
python-source = "python"
module-name = "horismos._horismos"
# What the published wheel compiles in: every bridge that has an
# implementation, so `pip install horismos` reaches them (captain's decision,
# 2026-09-23: one wheel with everything). Each crate's own default stays empty
# — this list, not a crate default, is the opt-in. It also defines the release
# closure scripts/generate_third_party_notices.py reads.
features = ["pyo3/extension-module", "bridges-jev", "bridges-openrouter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["python", "scripts"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
